name: Dependency Refresh

on:
  push:
    branches:
      - "agent/extension-p0-hardening"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload authoritative lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: phantom-trail-lockfiles-${{ github.sha }}
          path: |
            pnpm-lock.yaml
            package-lock.json
          if-no-files-found: error
          retention-days: 1
