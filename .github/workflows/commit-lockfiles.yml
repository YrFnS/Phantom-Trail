name: Commit Regenerated Lockfiles

on:
  push:
    branches:
      - "agent/extension-p0-hardening"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: commit-extension-lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download authoritative lockfile artifact
        shell: bash
        env:
          ARTIFACT_ID: "9225997026"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/lockfiles.zip"
          mkdir -p "$RUNNER_TEMP/lockfiles"
          unzip -q "$RUNNER_TEMP/lockfiles.zip" -d "$RUNNER_TEMP/lockfiles"
          cp "$RUNNER_TEMP/lockfiles/pnpm-lock.yaml" ./pnpm-lock.yaml
          cp "$RUNNER_TEMP/lockfiles/package-lock.json" ./package-lock.json

      - name: Verify lockfiles
        shell: bash
        run: |
          set -euo pipefail
          grep -q "tldts:" pnpm-lock.yaml
          grep -q '"tldts"' package-lock.json

      - name: Commit generated lockfiles and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dependency-refresh.yml
          rm -f .github/workflows/commit-lockfiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json pnpm-lock.yaml .github/workflows
          git commit -m "chore: commit regenerated lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
