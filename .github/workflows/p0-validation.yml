name: P0 validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/p0-truthfulness-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository pnpm version
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build Chrome extension
        run: pnpm build

      - name: Upload unpacked Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: phantom-trail-p0-chrome
          path: .output/chrome-mv3
          if-no-files-found: error
          retention-days: 7
