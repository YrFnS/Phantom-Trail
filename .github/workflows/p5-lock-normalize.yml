name: P5 Lockfile Normalization

on:
  push:
    branches:
      - agent/p5-evidence-release-discipline
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/p5-lock-normalize.yml

permissions:
  contents: write

concurrency:
  group: p5-lock-normalize
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out P5 branch
        uses: actions/checkout@v6
        with:
          ref: agent/p5-evidence-release-discipline
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Restrict generated change to pnpm-lock.yaml
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          if [ "$changed" != "pnpm-lock.yaml" ]; then
            echo "::error::Unexpected files changed during lock normalization:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(p5): synchronize dependency lockfile"
          git push origin HEAD:agent/p5-evidence-release-discipline
