name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  dependency-lock:
    name: Dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile in the runner
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload regenerated lockfile for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-pnpm-lock-${{ env.SOURCE_SHA }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Require committed lockfile to match package.json
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is not synchronized with package.json. Download the regenerated lockfile artifact and commit the reviewed result."
            git --no-pager diff -- pnpm-lock.yaml
            exit 1
          fi

  evidence:
    name: Test, evidence, browser, and package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install stable Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2.1.2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Create evidence directory
        run: mkdir -p .artifacts

      - name: Unit and contract tests
        run: |
          set -o pipefail
          pnpm test | tee .artifacts/tests.tap

      - name: Curated detector regression corpus
        run: pnpm evidence:detectors

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build Chrome extension
        run: pnpm build

      - name: Create reviewable extension archive
        run: pnpm zip

      - name: Source and package security invariants
        run: pnpm evidence:security

      - name: Package and deterministic performance budgets
        run: pnpm evidence:performance

      - name: Production dependency inventory and advisory gate
        run: pnpm evidence:dependencies

      - name: Chromium lifecycle and accessibility contract
        env:
          CHROME_FOR_TESTING: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          cat > "$RUNNER_TEMP/chrome-p5" <<'SH'
          #!/usr/bin/env bash
          exec "$CHROME_FOR_TESTING" --disable-component-extensions-with-background-pages "$@"
          SH
          chmod +x "$RUNNER_TEMP/chrome-p5"
          CHROME_BIN="$RUNNER_TEMP/chrome-p5" xvfb-run -a pnpm evidence:browser

      - name: Generate commit-bound release evidence
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: pnpm evidence:release

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phantom-trail-diagnostics-${{ env.SOURCE_SHA }}
          path: .artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact extension and evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: phantom-trail-evidence-${{ env.SOURCE_SHA }}
          path: |
            .artifacts
            .output/*chrome*.zip
            .output/chrome-mv3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
