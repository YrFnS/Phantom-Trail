name: Retire Stale v1 Release

on:
  push:
    branches:
      - "agent/retire-stale-v1-release"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retire-stale-v1-release
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RELEASE_ID: "279313510"
      ASSET_ID: "345334471"
      EXPECTED_TAG: "v1.0.0"
      EXPECTED_ASSET_NAME: "phantom-trail-0.1.0-chrome.zip"
      EXPECTED_ASSET_SHA256: "8eac8c003268594ccb2a897123caffac4e8e5feb06d88d7b580a80547d92f904"
      RETIRED_RELEASE_NAME: "Phantom Trail v1.0.0 — Retired Historical Prototype (Do Not Install)"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify and back up the obsolete public asset
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          curl --fail-with-body --silent --show-error --location \
            "${headers[@]}" \
            "${api}/releases/${RELEASE_ID}" \
            --output "$RUNNER_TEMP/release-before.json"

          jq -e \
            --arg tag "$EXPECTED_TAG" \
            --arg name "$EXPECTED_ASSET_NAME" \
            --arg digest "sha256:${EXPECTED_ASSET_SHA256}" \
            --argjson asset_id "$ASSET_ID" \
            '.tag_name == $tag and
             (.assets | length) == 1 and
             .assets[0].id == $asset_id and
             .assets[0].name == $name and
             .assets[0].digest == $digest' \
            "$RUNNER_TEMP/release-before.json" >/dev/null

          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/assets/${ASSET_ID}" \
            --output "$RUNNER_TEMP/${EXPECTED_ASSET_NAME}"

          echo "${EXPECTED_ASSET_SHA256}  $RUNNER_TEMP/${EXPECTED_ASSET_NAME}" \
            | sha256sum --check --strict

          mkdir -p release-retirement-backup
          cp "$RUNNER_TEMP/release-before.json" release-retirement-backup/
          cp "$RUNNER_TEMP/${EXPECTED_ASSET_NAME}" release-retirement-backup/
          sha256sum release-retirement-backup/* \
            > release-retirement-backup/SHA256SUMS.txt

      - name: Preserve private backup in Actions
        uses: actions/upload-artifact@v7
        with:
          name: retired-v1-public-release-backup-${{ github.sha }}
          path: release-retirement-backup
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Rewrite the release and remove the obsolete installable asset
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          cat > "$RUNNER_TEMP/retired-release-body.md" <<'MARKDOWN'
          # Retired historical prototype — do not install

          This January 2026 hackathon release is retained only as a historical record. It is **superseded, experimental, and not production-ready**. Its obsolete downloadable extension asset was removed on August 14, 2026.

          The original release copy contained claims that the current project no longer supports, including exact real-time tracking detection, complete data-flow visibility, general AI chat/coaching, PDF export, privacy-tool effectiveness measurement, and an unqualified “no data collection” statement.

          The repository's current source remains version `0.1.0` and is still an experimental signal monitor. No stable replacement release has been approved. Do not use this historical tag or release page as evidence of current capabilities, privacy protection, security, compliance, accuracy, or release readiness.

          Review the current README, privacy disclosure, security policy, and the open stable-release checklist in issue #8 before evaluating the project.
          MARKDOWN

          jq -n \
            --arg name "$RETIRED_RELEASE_NAME" \
            --rawfile body "$RUNNER_TEMP/retired-release-body.md" \
            '{name: $name, body: $body, draft: false, prerelease: true, make_latest: "false"}' \
            > "$RUNNER_TEMP/release-patch.json"

          curl --fail-with-body --silent --show-error --location \
            --request PATCH \
            "${headers[@]}" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/release-patch.json" \
            "${api}/releases/${RELEASE_ID}" \
            --output "$RUNNER_TEMP/release-rewritten.json"

          curl --fail-with-body --silent --show-error \
            --request DELETE \
            "${headers[@]}" \
            "${api}/releases/assets/${ASSET_ID}"

      - name: Verify public release state and write retirement evidence
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          curl --fail-with-body --silent --show-error --location \
            "${headers[@]}" \
            "${api}/releases/${RELEASE_ID}" \
            --output "$RUNNER_TEMP/release-after.json"

          jq -e \
            --arg tag "$EXPECTED_TAG" \
            --arg name "$RETIRED_RELEASE_NAME" \
            '.tag_name == $tag and
             .name == $name and
             .draft == false and
             .prerelease == true and
             (.assets | length) == 0 and
             (.body | contains("Retired historical prototype")) and
             (.body | contains("not production-ready")) and
             (.body | contains("No stable replacement release has been approved"))' \
            "$RUNNER_TEMP/release-after.json" >/dev/null

          mkdir -p release-retirement-evidence
          cp "$RUNNER_TEMP/release-before.json" release-retirement-evidence/
          cp "$RUNNER_TEMP/release-after.json" release-retirement-evidence/

          jq -n \
            --arg schemaVersion "1" \
            --arg generatedAt "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg releaseId "$RELEASE_ID" \
            --arg releaseTag "$EXPECTED_TAG" \
            --arg releaseUrl "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${EXPECTED_TAG}" \
            --arg oldAssetId "$ASSET_ID" \
            --arg oldAssetName "$EXPECTED_ASSET_NAME" \
            --arg oldAssetSha256 "$EXPECTED_ASSET_SHA256" \
            --arg backupArtifact "retired-v1-public-release-backup-${GITHUB_SHA}" \
            --arg finalName "$RETIRED_RELEASE_NAME" \
            '{
              schemaVersion: ($schemaVersion | tonumber),
              generatedAt: $generatedAt,
              repository: $repository,
              workflowRunId: $workflowRunId,
              sourceCommit: $sourceCommit,
              action: "rewrite-historical-release-and-remove-obsolete-asset",
              release: {
                id: ($releaseId | tonumber),
                tag: $releaseTag,
                url: $releaseUrl,
                finalName: $finalName,
                draft: false,
                prerelease: true,
                publicAssetsRemaining: 0
              },
              removedAsset: {
                id: ($oldAssetId | tonumber),
                name: $oldAssetName,
                sha256: $oldAssetSha256,
                privateBackupArtifact: $backupArtifact
              },
              verification: {
                retiredWarningPresent: true,
                productionReadyClaimAbsent: true,
                obsoleteAssetAbsent: true,
                stableReplacementPublished: false
              }
            }' > release-retirement-evidence/evidence.json

          sha256sum release-retirement-evidence/* \
            > release-retirement-evidence/SHA256SUMS.txt

      - name: Upload retirement evidence
        uses: actions/upload-artifact@v7
        with:
          name: retired-v1-release-evidence-${{ github.sha }}
          path: release-retirement-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Remove one-time workflow from the branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/retire-stale-v1-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/retire-stale-v1-release.yml
          git commit -m "chore: remove one-time release retirement workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
